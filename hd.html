<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSS Styles -->
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      color: #333;
      height: 100vh; /* Full height */
      overflow: hidden; /* Prevent scrolling on body, manage in content */
    }
    .dashboard {
      display: flex;
      height: 100%; /* Full height for dashboard */
    }
    /* Sidebar Styles */
    .sidebar {
      width: 250px;
      background: #2c3e50;
      color: #ecf0f1;
      min-height: 100vh;
      position: fixed; /* Fixed sidebar */
      overflow-y: auto; /* Enable scroll */
    }
    .sidebar .logo {
      text-align: center;
      padding: 20px;
      font-size: 20px;
      background: #1abc9c;
      font-weight: bold;
    }
    .sidebar nav {
      padding: 20px 0;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      font-size: 16px;
      color: #ecf0f1;
      transition: background 0.3s;
      text-decoration: none; /* No underline on links */
    }
    .sidebar nav a:hover {
      background: #34495e; /* Hover Color */
    }
    .sidebar nav a.active {
      background: #16a085; /* Active Color */
    }
    .sidebar nav a i {
      width: 25px;
      text-align: center;
      margin-right: 10px;
      font-size: 18px;
    }
    /* Main Content Styles */
    .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
      overflow-y: auto; /* Enable scrolling in main content */
    }
    .header {
      background: #fff;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header .title {
      font-size: 24px;
      font-weight: 600;
    }
    .content {
      padding: 20px;
      height: calc(100vh - 80px); /* Adjust for header height */
      overflow-y: auto; /* Enable scrolling in content area */
    }
    /* Cards Section */
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .card {
      background: #fff;
      flex: 1;
      min-width: 200px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin-bottom: 10px;
      font-size: 18px;
      color: #555;
    }
    .card p {
      font-size: 24px;
      font-weight: bold;
    }
    /* Chart Container Styles */
    .chart-container {
      background: #fff;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    /* Additional Reports Section */
    .additional-reports {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .report-card {
      background: #fff;
      flex: 1;
      min-width: 300px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .report-card h3 {
      margin-bottom: 15px;
      font-size: 18px;
      color: #555;
    }
    /* Responsive Adjustments */
    @media(max-width: 768px) {
      .sidebar {
        width: 200px;
      }
      .main-content {
        margin-left: 200px;
        width: calc(100% - 200px);
      }
      .cards, .additional-reports {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <div class="logo">
        Hospital Dashboard
      </div>
      <nav>
          <a href="hd.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
          <a href="hdpatient.html"><i class="fas fa-user-md"></i> Patients</a>
          <a href="hddoctors.html"><i class="fas fa-procedures"></i> Doctors</a>
          <a href="#"><i class="fas fa-calendar-alt"></i> Staffs</a>
          <a href="#"><i class="fas fa-cogs"></i> Settings</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div class="header">
        <div class="title">Dashboard Overview</div>
        <div class="user-profile">
          <!-- Replace with actual profile details if needed -->
          <span>Dr. Smith</span>
        </div>
      </div>

      <!-- Content Section -->
      <div class="content">
        <!-- Metric Cards -->
        <div class="cards">
          <div class="card">
            <h3>Total Patients</h3>
            <p id="total-patients">1,200</p>
          </div>
          <div class="card">
            <h3>Appointments Today</h3>
            <p id="appointments-today">45</p>
          </div>
          <div class="card">
            <h3>Available Doctors</h3>
            <p id="available-doctors">25</p>
          </div>
          <div class="card">
            <h3>Bed Occupancy</h3>
            <p id="bed-occupancy">78%</p>
          </div>
        </div>

        <!-- Appointments Chart -->
        <div class="chart-container">
          <h3>Weekly Appointments</h3>
          <canvas id="appointmentsChart" width="400" height="150"></canvas>
        </div>

        <!-- Additional Reports Section -->
        <div class="additional-reports">
          <!-- Financial Report Card -->
          <div class="report-card">
            <h3>Financial Report</h3>
            <canvas id="financialChart" width="400" height="200"></canvas>
          </div>
          <!-- Ward-wise Bed Availability Card -->
          <div class="report-card">
            <h3>Ward-wise Bed Availability</h3>
            <canvas id="bedAvailabilityChart" width="400" height="200"></canvas>
          </div>
          <!-- Patient Demographics Card -->
          <div class="report-card">
            <h3>Patient Demographics</h3>
            <canvas id="patientDemographicsChart" width="400" height="200"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <!-- Chart.js Library via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Function to handle active state on sidebar items
    function setActive(element) {
      const items = element.parentElement.children;
      for (let i = 0; i < items.length; i++) {
        items[i].classList.remove('active');
      }
      element.classList.add('active');
    }

    // Appointments Chart (Line Chart)
    const ctxAppointments = document.getElementById('appointmentsChart').getContext('2d');
    const appointmentsChart = new Chart(ctxAppointments, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Appointments',
          data: [30, 45, 28, 60, 55, 40, 50],
          backgroundColor: 'rgba(26, 188, 156, 0.2)',
          borderColor: 'rgba(26, 188, 156, 1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 10
            }
          }
        }
      }
    });

    // Financial Report Chart (Bar Chart)
    const ctxFinancial = document.getElementById('financialChart').getContext('2d');
    const financialChart = new Chart(ctxFinancial, {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [
          {
            label: 'Revenue',
            data: [50000, 60000, 55000, 70000, 65000, 80000],
            backgroundColor: 'rgba(52, 152, 219, 0.7)',
            borderColor: 'rgba(52, 152, 219, 1)',
            borderWidth: 1
          },
          {
            label: 'Expenses',
            data: [30000, 35000, 32000, 40000, 38000, 45000],
            backgroundColor: 'rgba(231, 76, 60, 0.7)',
            borderColor: 'rgba(231, 76, 60, 1)',
            borderWidth: 1
          }
        ]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // Ward-wise Bed Availability Chart (Stacked Bar Chart)
    const ctxBed = document.getElementById('bedAvailabilityChart').getContext('2d');
    const bedAvailabilityChart = new Chart(ctxBed, {
      type: 'bar',
      data: {
        labels: ['Ward A', 'Ward B', 'Ward C', 'Ward D'],
        datasets: [
          {
            label: 'Available Beds',
            data: [30, 20, 25, 40],
            backgroundColor: 'rgba(46, 204, 113, 0.7)',
            borderColor: 'rgba(46, 204, 113, 1)',
            borderWidth: 1
          },
          {
            label: 'Occupied Beds',
            data: [70, 80, 75, 60],
            backgroundColor: 'rgba(231, 76, 60, 0.7)',
            borderColor: 'rgba(231, 76, 60, 1)',
            borderWidth: 1
          }
        ]
      },
      options: {
        plugins: {
          tooltip: {
            mode: 'index',
            intersect: false
          }
        },
        responsive: true,
        scales: {
          x: {
            stacked: true
          },
          y: {
            beginAtZero: true,
            stacked: true
          }
        }
      }
    });

    // Patient Demographics Chart (Doughnut Chart)
    const ctxDemographics = document.getElementById('patientDemographicsChart').getContext('2d');
    const patientDemographicsChart = new Chart(ctxDemographics, {
      type: 'doughnut',
      data: {
        labels: ['Male', 'Female', 'Other'],
        datasets: [{
          data: [600, 500, 100],
          backgroundColor: [
            'rgba(52, 152, 219, 0.7)',
            'rgba(155, 89, 182, 0.7)',
            'rgba(241, 196, 15, 0.7)'
          ],
          borderColor: [
            'rgba(52, 152, 219, 1)',
            'rgba(155, 89, 182, 1)',
            'rgba(241, 196, 15, 1)'
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true
      }
    });
  </script>
</body>
</html>
