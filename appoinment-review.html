<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patient appointment review form.">
    <meta name="keywords" content="appointment, review, approval, rejection">
    <meta name="author" content="Your Name">
    <title>Appointment Review - NIC X HS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="appointment-review.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <script src="appointment-review.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Patient Appointment Form</h1>
            <p><a href="patient-registration.html" class="home-link"><i class="fas fa-home"></i> Home</a></p>
        </div>
    </header>
    <main>
        <section class="appointment-review">
            <table class="appointment-details-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone No</th>
                        <th>Email</th>
                        <th>department</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Purpose</th>
                        <th>Approve</th>
                        <th>Reject</th>
                    </tr>
                </thead>
                <tbody id="appointment-details-body">
                    <!-- Appointment details will be populated here -->
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
