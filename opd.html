<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPD - Out-Patient Details</title>
    <style>
        /* Your existing CSS styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url("images/ipd2.avif"); /* Ensure this path is correct */
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            text-align: center;
            color: #064486;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            font-size: 1.1rem;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        textarea {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
            font-weight: 200;
        }

        textarea {
            height: 100px;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 10px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Out-Patient (OPD) Details</h1>
        </header>
        <form id="opd-form">
            <label for="patientName">Patient Name:</label>
            <input type="text" id="patientName" name="patientName" required />

            <label for="patientID">Patient-ID:</label>
            <input type="number" id="patientID" name="patientID" required />

            <label for="visitDate">Visit Date:</label>
            <input type="date" id="visitDate" name="visitDate" required />

            <label for="heartbeatRate">Heartbeat Rate (bpm):</label>
            <input type="number" id="heartbeatRate" name="heartbeatRate" required />

            <label for="temperature">Temperature (°C):</label>
            <input type="number" id="temperature" name="temperature" step="0.1" required />

            <label for="sugarLevel">Sugar Level (mg/dL):</label>
            <input type="number" id="sugarLevel" name="sugarLevel" required />

            <label for="bloodPressure">Blood Pressure (mmHg):</label>
            <input type="text" id="bloodPressure" name="bloodPressure" placeholder="e.g., 120/80" required />

            <label for="spo2">SpO2 Level (%):</label>
            <input type="number" id="spo2" name="spo2" max="100" min="0" required />

            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" required />

            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height" required />

            <label for="previousHistory">Previous Medical History:</label>
            <textarea id="previousHistory" name="previousHistory"></textarea>

            <label for="diagnosis">Diagnosis:</label>
            <textarea id="diagnosis" name="diagnosis" required></textarea>

            <label for="treatment">Treatment:</label>
            <textarea id="treatment" name="treatment"></textarea>

            <label for="prescription">Prescription:</label>
            <textarea id="prescription" name="prescription"></textarea>

            <input type="submit" value="Submit" />
        </form>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>  <!-- Or the latest version -->
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
        import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js';

        const firebaseConfig = {
            // Your Firebase project configuration
            apiKey: "AIzaSyBgtzx3R7WkQ05sprADf_iiiVrHhuUSIJs",
            authDomain: "hospital-a1bcc.firebaseapp.com",
            databaseURL: "https://hospital-a1bcc-default-rtdb.firebaseio.com",
            projectId: "hospital-a1bcc",
            storageBucket: "hospital-a1bcc.appspot.com",
            messagingSenderId: "1011214120740",
            appId: "1:1011214120740:web:97c32f4885b59a665fe5b1"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        document.getElementById('opd-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const opdData = {
                patientName: document.getElementById('patientName').value,
                patientID: document.getElementById('patientID').value,
                visitDate: document.getElementById('visitDate').value,
                heartbeatRate: document.getElementById('heartbeatRate').value,
                temperature: document.getElementById('temperature').value,
                sugarLevel: document.getElementById('sugarLevel').value,
                bloodPressure: document.getElementById('bloodPressure').value,
                spo2: document.getElementById('spo2').value,
                weight: document.getElementById('weight').value,
                height: document.getElementById('height').value,
                previousHistory: document.getElementById('previousHistory').value,
                diagnosis: document.getElementById('diagnosis').value,
                treatment: document.getElementById('treatment').value,
                prescription: document.getElementById('prescription').value
            };

            try {
                const opdRef = ref(database, 'opdDetails/' + Date.now());
                await set(opdRef, opdData);
                console.log("OPD data saved successfully.");
                alert("OPD details submitted successfully!");
                document.getElementById('opd-form').reset();
            } catch (error) {
                console.error("Error saving OPD data: ", error);
                alert("Error saving OPD details. Please try again.");
            }
        });
    </script>
</body>
</html>
